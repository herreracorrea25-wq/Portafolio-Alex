<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Usuarios</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Fondo general oscuro */
            color: #e0e0e0; /* Texto claro legible */
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 2.2rem;
            font-style: italic;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Contenedor adaptado exactamente para 5 columnas */
        .container {
            display: grid;
            /* Usamos repeat(5, 1fr) para forzar las 5 columnas en pantallas grandes */
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Responsivo para tablets y celulares */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .card {
            background: #1e1e1e; /* Fondo de la tarjeta oscuro */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            text-align: center;
            position: relative;
            border: 1px solid #2c2c2c;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            background: #252525;
        }

        .card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #3b82f6; /* Toque sutil azul oscuro/neón */
        }

        .card h3 {
            margin: 10px 0 5px 0;
            color: #ffffff;
            font-size: 1.1rem;
            font-style: italic;
        }

        .card p {
            margin: 5px 0;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .star {
            position: absolute;
            right: 12px;
            top: 12px;
            font-size: 22px;
            color: #555555; /* Estrella inactiva oscura */
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .star:hover {
            color: #ffb400;
        }

        .star.active {
            color: #ffb400; /* Estrella activa dorada brillante */
            text-shadow: 0 0 8px rgba(255, 180, 0, 0.4);
        }
    </style>
</head>

<body>

    <h1>Directorio de Usuarios</h1>

    <div id="usuarios-container" class="container"></div>

    <script>
        const urlAPI = "https://randomuser.me/api/?results=100"; // Pedimos los 100 usuarios

        async function cargarUsuarios() {
            try {
                const respuesta = await fetch(urlAPI);
                const datos = await respuesta.json();
                const usuarios = datos.results;

                const contenedor = document.getElementById("usuarios-container");
                contenedor.innerHTML = "";

                usuarios.forEach(usuario => {
                    const card = document.createElement("div");
                    card.classList.add("card");

                    // Revisar si está en favoritos
                    const favoritosInit = JSON.parse(localStorage.getItem('favoritos') || '[]');
                    const esFavorito = favoritosInit.some(f => f.login.uuid === usuario.login.uuid);

                    card.innerHTML = `
                        <div style="position:relative;">
                            <span class="star ${esFavorito ? 'active' : ''}" title="Favorito">★</span>
                            <img src="${usuario.picture.medium}" alt="Foto de ${usuario.name.first}">
                        </div>
                        <h3>${usuario.name.title} ${usuario.name.first} ${usuario.name.last}</h3>
                        <p><strong>Edad:</strong> ${usuario.dob.age} años</p>
                        <p><strong>Género:</strong> ${usuario.gender}</p>
                    `;

                    // Click en la tarjeta -> abrir detalle
                    card.addEventListener("click", () => {
                        localStorage.setItem("usuarioSeleccionado", JSON.stringify(usuario));
                        window.location.href = "detalle.html";
                    });

                    // Click en la estrella -> toggle favorito
                    const star = card.querySelector('.star');
                    star.addEventListener('click', (e) => {
                        e.stopPropagation();
                        let favs = JSON.parse(localStorage.getItem('favoritos') || '[]');
                        const idx = favs.findIndex(f => f.login.uuid === usuario.login.uuid);
                        
                        if (idx === -1) {
                            // Agregar a favoritos
                            const favObj = {
                                login: usuario.login,
                                name: usuario.name,
                                picture: usuario.picture,
                                dob: usuario.dob,
                                gender: usuario.gender,
                                email: usuario.email,
                                phone: usuario.phone,
                                cell: usuario.cell,
                                location: usuario.location
                            };
                            favs.push(favObj);
                            star.classList.add('active');
                            localStorage.setItem('favoritos', JSON.stringify(favs));
                            window.location.href = 'favoritos.html';
                            return;
                        } else {
                            // Quitar de favoritos
                            favs.splice(idx, 1);
                            star.classList.remove('active');
                        }
                        localStorage.setItem('favoritos', JSON.stringify(favs));
                    });

                    contenedor.appendChild(card);
                });
            } catch (error) {
                console.error("Error al consumir la API:", error);
            }
        }

        cargarUsuarios();
    </script>
</body>

</html>
